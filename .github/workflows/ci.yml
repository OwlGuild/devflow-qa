name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://devflow-api-jtmi.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: k6 scripts bundle and validate
        run: docker run --rm -v "$PWD:/w" -w /w grafana/k6:latest inspect load/health.js
